include: [./ros2_realsense_d435i_camera_calibration/docker-compose.yaml]
services:

  orb_slam3:
    extends:
      service: base
    image: "orb_slam3:latest"
    volumes:
      - .:/ros2_ws/src/ORB_SLAM3_ROS2
      - ./videos:/ros2_ws/src/ORB_SLAM3_ROS2/videos
      - ./bags:/ros2_ws/src/ORB_SLAM3_ROS2/bags
      - ./outputs:/ros2_ws/src/ORB_SLAM3_ROS2/outputs
    command: >
      ros2 launch orb_slam3_ros2 mapping.launch.py

  base:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        - USER_UID=${USER_UID:-1000}
        - USER_GID=${USER_GID:-1000}
        - USERNAME=${USERNAME}
    network_mode: host
    ipc: host
    privileged: true
    tty: true
    init: true
    stdin_open: true
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: ${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
